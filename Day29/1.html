<!DOCTYPE html>

</head>

<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

/* ---------------------------------------------------------
   RANDOM DATA POOLS
--------------------------------------------------------- */
const INDUSTRIES = [
  "Consumer Electronics", "Automotive Parts", "Pharmaceutical Manufacturing",
  "Fast Fashion Apparel", "Home Appliances", "Industrial Machinery",
  "Food & Beverage Processing", "Semiconductor Components", "Furniture Manufacturing",

];

const COUNTRY_SETS = [
  ["Vietnam", "Germany", "Mexico"],
  ["China", "Poland", "Brazil"],
  ["India", "USA", "Netherlands"],
  ["Taiwan", "Italy", "Canada"],

  ["Bangladesh", "France", "Chile"],
  ["Indonesia", "Czech Republic", "Colombia"]

const COMPANY_PREFIXES = ["Nova", "Orbit", "Vertex", "Solace", "Anchor", "Kestrel", "Palisade", "Meridian", "Ironbrook", "Zephyr", "Halcyon", "Cobalt"];
const COMPANY_SUFFIXES = ["Industries", "Global", "Manufacturing Co.", "Group", "Dynamics", "Holdings", "Works", "Systems", "Logistics"];

function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function randFloat(min, max, decimals=1){
  const v = Math.random() * (max - min) + min;
  return parseFloat(v.toFixed(decimals));
}
function pick(arr){ return arr[randInt(0, arr.length - 1)]; }
function clamp(v, min=0, max=100){ return Math.max(min, Math.min(max, v)); }

function generateCompany(){
  const name = `${pick(COMPANY_PREFIXES)} ${pick(COMPANY_SUFFIXES)}`;
  const industry = pick(INDUSTRIES);
  const countries = pick(COUNTRY_SETS);
  return {
    name,
    industry,
    revenue: randInt(80, 950), // millions
    factories: randInt(2, 9),
    warehouses: randInt(3, 14),
    suppliers: randInt(8, 45),
    inventoryDays: randInt(12, 60),
    leadTime: randInt(10, 75), // days
    countries
  };
}

/* ---------------------------------------------------------
   CEO BOARDROOM QUESTIONS
--------------------------------------------------------- */
const BOARDROOM_QUESTIONS = [
  {
    q: "The board is pressuring you to announce a fix publicly before your team has verified it will work. What do you do?",

/* ---------------------------------------------------------
   SMALL REUSABLE COMPONENTS
--------------------------------------------------------- */
function Bar({ label, value, max=100, kind="accent", suffix="" }){
  const pct = clamp((value/max)*100);
  let fillClass = "fill-accent";
  if(kind === "good") fillClass = "fill-good";
  if(kind === "warn") fillClass = "fill-warn";
  if(kind === "bad") fillClass = "fill-bad";
  return (
    <div>
      <div className="metric-row">
        <span>{label}</span>
        <span>{Math.round(value)}{suffix}</span>
      </div>
      <div className="metric-bar-bg">
        <div className="metric-bar-fill" style={{width: pct + "%"}} className={"metric-bar-fill " + fillClass}></div>
      </div>
    </div>
  );
}

function StepIndicator({ steps, currentIndex }){
  return (
    <div className="stepper">
      {steps.map((s, i) => (
        <span key={s} className={"step-pill " + (i === currentIndex ? "active" : i < currentIndex ? "done" : "")}>
          {i < currentIndex ? "✓ " : ""}{s}
        </span>
      ))}
    </div>
  );
}

/* ---------------------------------------------------------
   SCREEN: WAR ROOM
--------------------------------------------------------- */
function WarRoom({ onComplete }){
  const [selected, setSelected] = useState([]);
  const [confirmed, setConfirmed] = useState(false);
  const [metrics, setMetrics] = useState({ cost:50, inventory:50, profit:50, delivery:50, satisfaction:50 });

  function toggle(key){
    if(confirmed) return;
    setSelected(prev => {
      if(prev.includes(key)) return prev.filter(k => k !== key);
      if(prev.length >= 3) return prev;
      return [...prev, key];
    });
  }

  function confirmActions(){
    if(selected.length !== 3) return;
    const chosen = WAR_ROOM_ACTIONS.filter(a => selected.includes(a.key));
    const newMetrics = { cost:50, inventory:50, profit:50, delivery:50, satisfaction:50 };
    chosen.forEach(a => {
      newMetrics.cost = clamp(newMetrics.cost + a.effects.cost);
      newMetrics.inventory = clamp(newMetrics.inventory + a.effects.inventory);
      newMetrics.profit = clamp(newMetrics.profit + a.effects.profit);
      newMetrics.delivery = clamp(newMetrics.delivery + a.effects.delivery);
      newMetrics.satisfaction = clamp(newMetrics.satisfaction + a.effects.satisfaction);
    });
    setConfirmed(true);
    setTimeout(() => setMetrics(newMetrics), 100);
  }

  return (
    <div className="fade-in">
      <h2>🧭 War Room: Immediate Response</h2>
      <p>Pick exactly <b>3 of the 6</b> available actions. There's no single "correct" combo — each choice trades one
      priority for another. Watch how your five key metrics respond once you confirm.</p>

      <div className="grid grid-2 mt16">
        {WAR_ROOM_ACTIONS.map(a => {
          const isSelected = selected.includes(a.key);
          const isLocked = !isSelected && selected.length >= 3;
          return (
            <div
              key={a.key}
              className={"choice-card " + (isSelected ? "selected" : "") + (isLocked || confirmed ? " locked" : "")}
              onClick={() => toggle(a.key)}
            >
              <span style={{fontSize:"1.4rem"}}>{a.icon}</span>
              <h3 className="mt8">{a.title}</h3>
              <p style={{fontSize:"0.9rem"}}>{a.desc}</p>
              <div className="why-box"><b>Why it matters:</b> {a.why}</div>
              {isSelected && <div className="tag mt8" style={{background:"rgba(57,217,138,0.15)", color:"var(--good)", borderColor:"rgba(57,217,138,0.4)"}}>✓ Selected</div>}
            </div>
          );
        })}
      </div>

      {!confirmed && (
        <div className="footer-nav">
          <span className="muted" style={{alignSelf:"center"}}>{selected.length}/3 selected</span>
          <button className="btn btn-primary" disabled={selected.length !== 3} onClick={confirmActions}>
            Confirm Response →
          </button>
        </div>
      )}

      {confirmed && (
        <div className="card mt24 fade-in">
          <h3>📊 Impact of Your Response</h3>
          <p className="muted">Bars animate to reflect the combined effect of your three chosen actions.</p>
          <div className="mt16">
            <Bar label="Cost Control" value={metrics.cost} kind={metrics.cost >= 55 ? "good" : metrics.cost >= 40 ? "warn" : "bad"} />
            <Bar label="Inventory Health" value={metrics.inventory} kind={metrics.inventory >= 55 ? "good" : metrics.inventory >= 40 ? "warn" : "bad"} />
            <Bar label="Profit Impact" value={metrics.profit} kind={metrics.profit >= 55 ? "good" : metrics.profit >= 40 ? "warn" : "bad"} />
            <Bar label="Delivery Speed" value={metrics.delivery} kind={metrics.delivery >= 55 ? "good" : metrics.delivery >= 40 ? "warn" : "bad"} />
            <Bar label="Customer Satisfaction" value={metrics.satisfaction} kind={metrics.satisfaction >= 55 ? "good" : metrics.satisfaction >= 40 ? "warn" : "bad"} />
          </div>
          <div className="footer-nav">
            <div></div>
            <button className="btn btn-primary" onClick={() => onComplete({ metrics, chosenActions: selected })}>
              Proceed to Negotiation →
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   SCREEN: NEGOTIATION
--------------------------------------------------------- */
function Negotiation({ onComplete }){
  const [round, setRound] = useState(0);
  const [state, setState] = useState({ trust:50, price:50, leadTime:50 });
  const [lastChoice, setLastChoice] = useState(null);
  const [history, setHistory] = useState([]);

  function choose(opt){
    const newState = {
      trust: clamp(state.trust + opt.trust),
      price: clamp(state.price + opt.price),
      leadTime: clamp(state.leadTime + opt.leadTime)
    };
    setLastChoice(opt);
    setHistory(h => [...h, opt]);
    setState(newState);
  }

  function next(){
    if(round < NEGOTIATION_ROUNDS.length - 1){
      setRound(round + 1);
      setLastChoice(null);
    } else {
      const score = Math.round((state.trust + state.price + state.leadTime) / 3);
      onComplete({ negotiation: state, negotiationScore: score });
    }
  }

  const currentRound = NEGOTIATION_ROUNDS[round];

  return (
    <div className="fade-in">
      <h2>🤝 Supplier Negotiation — Round {round + 1} of {NEGOTIATION_ROUNDS.length}</h2>
      <p>Every round shifts three things: <b>Trust</b> (relationship health), <b>Price</b> (favorability of terms), and <b>Lead Time</b> (speed improvement). There's rarely a free lunch — read the "why" before you commit.</p>

      <div className="grid grid-3 mt16">
        <Bar label="Trust" value={state.trust} kind={state.trust >= 55 ? "good" : state.trust >= 40 ? "warn" : "bad"} />
        <Bar label="Price Favorability" value={state.price} kind={state.price >= 55 ? "good" : state.price >= 40 ? "warn" : "bad"} />
        <Bar label="Lead Time Improvement" value={state.leadTime} kind={state.leadTime >= 55 ? "good" : state.leadTime >= 40 ? "warn" : "bad"} />
      </div>

      <div className="card mt16">
        <h3>{currentRound.title}</h3>
        <p>{currentRound.context}</p>

        {!lastChoice && (
          <div className="grid mt16" style={{gridTemplateColumns:"1fr"}}>
            {currentRound.options.map((opt, idx) => (
              <div key={idx} className="choice-card" onClick={() => choose(opt)}>
                <p style={{margin:0, color:"var(--text-0)"}}>{opt.label}</p>
              </div>
            ))}
          </div>
        )}

        {lastChoice && (
          <div className="fade-in mt16">
            <div className="choice-card selected">
              <p style={{margin:0, color:"var(--text-0)"}}>{lastChoice.label}</p>
            </div>
            <div className="why-box"><b>Why this matters:</b> {lastChoice.why}</div>
            <div className="footer-nav">
              <div></div>
              <button className="btn btn-primary" onClick={next}>
                {round < NEGOTIATION_ROUNDS.length - 1 ? "Next Round →" : "Finalize Negotiation →"}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function Boardroom({ onComplete }){
  const [qIndex, setQIndex] = useState(0);
  const [answered, setAnswered] = useState(null);
  const [totalScore, setTotalScore] = useState(0);
  const [log, setLog] = useState([]);

  const question = BOARDROOM_QUESTIONS[qIndex];

  function choose(opt){
    setAnswered(opt);
  }

  function next(){
    const newScore = totalScore + answered.score;
    const newLog = [...log, { q: question.q, choice: answered.label, score: answered.score, why: answered.why }];
    if(qIndex < BOARDROOM_QUESTIONS.length - 1){
      setTotalScore(newScore);
      setLog(newLog);
      setQIndex(qIndex + 1);
      setAnswered(null);
    } else {
      const maxScore = BOARDROOM_QUESTIONS.length * 9;
      const leadershipScore = Math.round((newScore / maxScore) * 100);
      onComplete({ leadershipScore, boardroomLog: newLog });
    }

  return (
    <div className="fade-in">
      <h2>👔 CEO Boardroom — Question {qIndex + 1} of {BOARDROOM_QUESTIONS.length}</h2>
      <p>These questions test executive judgment under pressure — not technical knowledge. Think about what builds long-term trust and stability, not just what feels fastest.</p>

      <div className="card mt16">
        <h3>{question.q}</h3>
        {!answered && (
          <div className="grid mt16" style={{gridTemplateColumns:"1fr"}}>
            {question.options.map((opt, idx) => (
              <div key={idx} className="choice-card" onClick={() => choose(opt)}>

        {answered && (
          <div className="fade-in mt16">
            <div className="choice-card selected">

  );
}

/* ---------------------------------------------------------
   SCREEN: FINAL DASHBOARD
--------------------------------------------------------- */
function FinalDashboard({ gameData, onReplay }){
  const { company, crisis, metrics, chosenActions, negotiation, negotiationScore, leadershipScore, boardroomLog, aiInvestments } = gameData;

  const resilience = clamp(Math.round((metrics.inventory + metrics.delivery) / 2));
  const costControl = clamp(metrics.cost);
  const riskManagement = clamp(Math.round((negotiationScore + leadershipScore) / 2 * 0.6 + resilience * 0.4));
  const customerSatisfaction = clamp(metrics.satisfaction);
  const negotiationDisplay = clamp(negotiationScore);
  const leadershipDisplay = clamp(leadershipScore);

  const overall = Math.round(
    (leadershipDisplay * 0.2) +
    (negotiationDisplay * 0.2) +
    (resilience * 0.2) +
    (costControl * 0.15) +
    (riskManagement * 0.15) +
    (customerSatisfaction * 0.1)
  );

  const chosenActionObjs = WAR_ROOM_ACTIONS.filter(a => chosenActions.includes(a.key));
  const aiObjs = AI_INVESTMENTS.filter(a => aiInvestments.includes(a.key));

  // Determine biggest mistake & best decision heuristically
  const worstBoardroom = boardroomLog.reduce((min, cur) => cur.score < min.score ? cur : min, boardroomLog[0]);
  const bestBoardroom = boardroomLog.reduce((max, cur) => cur.score > max.score ? cur : max, boardroomLog[0]);

  let biggestMistake = `In the boardroom, choosing "${worstBoardroom.choice}" was the weakest leadership call — ${worstBoardroom.why}`;
  if(costControl < 40){
    biggestMistake = `Your War Room combo pushed costs too high. Actions like ${chosenActionObjs.map(a=>a.title).join(", ")} delivered speed and satisfaction, but the cumulative cost hit was severe.`;
  }

  let bestDecision = `In the boardroom, choosing "${bestBoardroom.choice}" was your strongest leadership call — ${bestBoardroom.why}`;
  if(negotiationDisplay >= 70){
    bestDecision = `Your supplier negotiation strategy was excellent — you built strong trust (${Math.round(negotiation.trust)}/100) while still improving price and lead time terms.`;
  }

  let overallTier = "Needs Improvement";
  let tierColor = "var(--bad)";
  if(overall >= 80){ overallTier = "Exceptional Crisis Leadership"; tierColor = "var(--good)"; }
  else if(overall >= 65){ overallTier = "Strong Performance"; tierColor = "var(--good)"; }
  else if(overall >= 45){ overallTier = "Solid, With Gaps"; tierColor = "var(--warn)"; }

  let expertRecommendation = "";
  if(resilience < 50){
    expertRecommendation = "Prioritize rebuilding inventory buffers and diversifying suppliers before the next disruption — resilience was your weakest structural pillar this round.";
  } else if(costControl < 50){
    expertRecommendation = "Next time, weigh cost-saving actions more heavily in the War Room. Speed and satisfaction matter, but sustained cost bleed erodes long-term competitiveness.";
  } else if(negotiationDisplay < 50){
    expertRecommendation = "Invest in negotiation training focused on collaborative framing — trust-building tactics tend to outperform aggressive tactics over multi-round supplier relationships.";
  } else {
    expertRecommendation = "Your fundamentals are strong. Focus next on scaling AI-driven risk monitoring so future crises are detected before they escalate this far.";
  }

  const lessons = [
    "Crisis response is about tradeoffs, not perfect answers — every War Room action helps one metric while straining another.",
    "Trust built early in a negotiation compounds — collaborative openings tend to outperform aggressive ones over multiple rounds.",
    "Transparent communication with customers and investors preserves satisfaction even when outcomes are imperfect.",
    "Resilience (inventory + delivery capacity) is what determines how much runway you have when the next disruption hits.",
    "AI investments pay off most when they target the specific weakness a crisis just exposed, not just the trendiest option."
  ];

  return (
    <div className="fade-in">
      <h2>📊 Final Performance Dashboard</h2>
      <p><b>{company.name}</b> — Crisis: {crisis.title}</p>

      <div className="card score-hero mt16">
        <div className="score-num">{overall}</div>
        <p className="muted">Overall Crisis Score / 100</p>
        <span className="tag" style={{color: tierColor, borderColor: tierColor, background:"transparent", fontSize:"0.9rem", padding:"6px 16px"}}>
          {overallTier}
        </span>
      </div>

      <div className="grid grid-3 mt24">
        <div className="card">
          <Bar label="Leadership" value={leadershipDisplay} kind={leadershipDisplay >= 60 ? "good" : leadershipDisplay >= 40 ? "warn" : "bad"} />
        </div>
        <div className="card">
          <Bar label="Negotiation" value={negotiationDisplay} kind={negotiationDisplay >= 60 ? "good" : negotiationDisplay >= 40 ? "warn" : "bad"} />
        </div>
        <div className="card">
          <Bar label="Resilience" value={resilience} kind={resilience >= 60 ? "good" : resilience >= 40 ? "warn" : "bad"} />
        </div>
        <div className="card">
          <Bar label="Cost Control" value={costControl} kind={costControl >= 60 ? "good" : costControl >= 40 ? "warn" : "bad"} />
        </div>
        <div className="card">
          <Bar label="Risk Management" value={riskManagement} kind={riskManagement >= 60 ? "good" : riskManagement >= 40 ? "warn" : "bad"} />
        </div>
        <div className="card">
          <Bar label="Customer Satisfaction" value={customerSatisfaction} kind={customerSatisfaction >= 60 ? "good" : customerSatisfaction >= 40 ? "warn" : "bad"} />
        </div>
      </div>

      <div className="divider"></div>

      <div className="grid grid-2">
        <div className="card">
          <h3>❌ Biggest Mistake</h3>
          <p>{biggestMistake}</p>
        </div>
        <div className="card">
          <h3>✅ Best Decision</h3>
          <p>{bestDecision}</p>
        </div>
      </div>

      <div className="card mt16">
        <h3>🎯 Expert Recommendation</h3>
        <p>{expertRecommendation}</p>
      </div>

      <div className="card mt16">
        <h3>📚 Lessons Learned</h3>
        <ul className="clean">
          {lessons.map((l,i) => <li key={i}>{l}</li>)}
        </ul>
      </div>

      <div className="card mt16">
        <h3>🗂️ Your Playthrough Summary</h3>
        <p><b>War Room actions:</b> {chosenActionObjs.map(a => a.title).join(", ")}</p>
        <p><b>AI investments:</b> {aiObjs.map(a => a.title).join(", ")}</p>
        <p><b>Negotiation outcome:</b> Trust {Math.round(negotiation.trust)}/100, Price Favorability {Math.round(negotiation.price)}/100, Lead Time Improvement {Math.round(negotiation.leadTime)}/100</p>
      </div>

      <div className="center mt24">
        <button className="btn btn-primary" style={{padding:"14px 30px"}} onClick={onReplay}>🔄 Replay Simulation</button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   ROOT APP
--------------------------------------------------------- */
const STEP_LABELS = ["Briefing", "War Room", "Negotiation", "Boardroom", "AI Strategy", "Dashboard"];

function App(){
  const [screen, setScreen] = useState("welcome"); // welcome | game
  const [stepIndex, setStepIndex] = useState(0);
  const [gameData, setGameData] = useState(null);

  function startGame(){
    const company = generateCompany();
    const crisis = generateCrisis();
    setGameData({ company, crisis });
    setStepIndex(0);
    setScreen("briefing");
  }

  function replay(){
    setScreen("welcome");
    setGameData(null);
    setStepIndex(0);
  }

  function goTo(step, patch){
    setGameData(prev => ({ ...prev, ...patch }));
    setStepIndex(step);
  }

  let content = null;
  let showStepper = true;

  if(screen === "welcome"){
    content = <Welcome onStart={startGame} />;
    showStepper = false;
  } else if(screen === "briefing"){
    content = <CompanyBriefing company={gameData.company} crisis={gameData.crisis} onContinue={() => { setScreen("warroom"); }} />;
  } else if(screen === "warroom"){
    content = <WarRoom onComplete={(data) => { goTo(1, data); setScreen("negotiation"); }} />;
  } else if(screen === "negotiation"){
    content = <Negotiation onComplete={(data) => { goTo(2, data); setScreen("boardroom"); }} />;
  } else if(screen === "boardroom"){
    content = <Boardroom onComplete={(data) => { goTo(3, data); setScreen("aistrategy"); }} />;
  } else if(screen === "aistrategy"){
    content = <AIStrategy onComplete={(data) => { goTo(4, data); setScreen("dashboard"); }} />;
  } else if(screen === "dashboard"){
    content = <FinalDashboard gameData={gameData} onReplay={replay} />;
  }

  const stepMap = {
    briefing: 0, warroom: 1, negotiation: 2, boardroom: 3, aistrategy: 4, dashboard: 5
  };
  const currentStep = stepMap[screen] ?? 0;

  return (
    <div className="app-shell">
      <div className="topbar">
        <div className="brand">
          <span className="brand-dot"></span>
          <span>Operation Lifeline</span>
        </div>
        {showStepper && <StepIndicator steps={STEP_LABELS} currentIndex={currentStep} />}
      </div>
      {content}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
