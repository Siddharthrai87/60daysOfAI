```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Integrity Analyzer</title>
<style>
  :root {
    --bg: #16130f;
    --bg-alt: #1e1a14;
    --card: #211c16;
    --card-hover: #2a241c;
    --border: #3a3226;
    --accent: #da7756;
    --accent-bright: #ff8f66;
    --accent-dim: #a85a3f;
    --text: #f2ede4;
    --text-dim: #b8ada0;
    --text-faint: #7a7166;
    --good: #6fbf8b;
    --warn: #e0b84a;
    --bad: #e0654a;
    --shadow: 0 10px 30px rgba(0,0,0,0.5);
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(circle at 20% 0%, #251e17 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    min-height: 100vh;
    line-height: 1.6;
  }

  .app {
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 20px 100px;
  }

  header.top {
    text-align: center;
    margin-bottom: 36px;
    animation: fadeDown 0.6s ease;
  }

  header.top h1 {
    font-size: 2.4rem;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--accent-bright), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700;
  }

  header.top p {
    color: var(--text-dim);
    font-size: 1.05rem;
    margin-top: 8px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  .progress-track {
    display: flex;
    gap: 8px;
    margin: 24px 0 8px;
  }

  .progress-step {
    flex: 1;
    height: 6px;
    border-radius: 4px;
    background: var(--border);
    overflow: hidden;
    position: relative;
  }

  .progress-step .fill {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent-bright));
    width: 0%;
    transition: width 0.6s ease;
  }

  .progress-label {
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-faint);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .metrics-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 32px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  .metric-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    transition: transform 0.3s ease, border-color 0.3s ease;
  }

  .metric-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent-dim);
  }

  .metric-card .m-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-faint);
    margin-bottom: 6px;
  }

  .metric-card .m-value {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent-bright);
  }

  .metric-bar-track {
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    margin-top: 8px;
    overflow: hidden;
  }

  .metric-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent-bright));
    width: 0%;
    transition: width 0.8s ease;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
    animation: fadeUp 0.5s ease;
  }

  .card h2 {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 1.4rem;
    color: var(--accent-bright);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .badge {
    display: inline-block;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    background: rgba(218,119,86,0.15);
    color: var(--accent-bright);
    border: 1px solid var(--accent-dim);
    padding: 3px 10px;
    border-radius: 20px;
  }

  .concept-box {
    background: var(--bg-alt);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 16px 18px;
    margin: 16px 0;
    font-size: 0.95rem;
    color: var(--text-dim);
  }

  .concept-box strong { color: var(--text); }

  .headline-display {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 1.5rem;
    font-weight: 800;
    line-height: 1.35;
    color: var(--text);
    margin: 18px 0 10px;
    padding: 20px;
    background: var(--bg-alt);
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .article-body {
    font-size: 0.98rem;
    color: var(--text-dim);
    padding: 16px 20px;
    background: var(--bg-alt);
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 6px;
  }

  .source-tag {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.78rem;
    color: var(--text-faint);
    margin-bottom: 14px;
    letter-spacing: 0.3px;
  }

  .post-card {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin: 16px 0;
    font-size: 1.02rem;
    color: var(--text);
  }

  .post-meta {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.78rem;
    color: var(--text-faint);
    margin-bottom: 10px;
  }

  .choice-row {
    display: flex;
    gap: 12px;
    margin: 18px 0;
    flex-wrap: wrap;
  }

  .choice-btn {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    flex: 1;
    min-width: 100px;
    padding: 12px 16px;
    background: var(--bg-alt);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    transition: all 0.25s ease;
  }

  .choice-btn:hover {
    border-color: var(--accent);
    background: rgba(218,119,86,0.1);
    transform: translateY(-2px);
  }

  .choice-btn.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1410;
  }

  textarea, input[type="text"] {
    width: 100%;
    background: var(--bg-alt);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 14px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.95rem;
    resize: vertical;
    min-height: 70px;
    transition: border-color 0.25s ease;
  }

  textarea:focus, input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  .btn-primary {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(135deg, var(--accent-bright), var(--accent-dim));
    color: #1a1410;
    border: none;
    padding: 13px 26px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 16px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(218,119,86,0.35);
  }

  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .btn-secondary {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: transparent;
    color: var(--text-dim);
    border: 1.5px solid var(--border);
    padding: 12px 24px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
    margin-left: 10px;
    transition: all 0.25s ease;
  }

  .btn-secondary:hover {
    border-color: var(--accent);
    color: var(--text);
  }

  .reveal {
    margin-top: 22px;
    padding-top: 22px;
    border-top: 1px dashed var(--border);
    animation: fadeUp 0.5s ease;
  }

  .score-ring-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .score-circle {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 1.5rem;
    font-weight: 800;
    background: conic-gradient(var(--accent-bright) 0deg, var(--border) 0deg);
    position: relative;
    flex-shrink: 0;
  }

  .score-circle::before {
    content: '';
    position: absolute;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: var(--card);
  }

  .score-circle span { z-index: 1; }

  .score-text-block h3 {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 1.1rem;
    color: var(--text);
  }

  .score-text-block p { color: var(--text-dim); font-size: 0.9rem; }

  .highlight-mismatch {
    background: rgba(224,101,74,0.2);
    color: var(--bad);
    padding: 1px 5px;
    border-radius: 4px;
    font-weight: 700;
    border-bottom: 2px solid var(--bad);
  }

  .highlight-emotion {
    background: rgba(224,184,74,0.2);
    color: var(--warn);
    padding: 1px 5px;
    border-radius: 4px;
    font-weight: 700;
    border-bottom: 2px solid var(--warn);
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin: 16px 0;
  }

  .info-box {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .info-box .lbl {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent-bright);
    margin-bottom: 6px;
  }

  .info-box .val {
    color: var(--text);
    font-size: 0.92rem;
  }

  .rewrite-box {
    background: rgba(111,191,139,0.1);
    border: 1px solid var(--good);
    border-radius: 10px;
    padding: 16px 18px;
    margin: 14px 0;
    color: var(--text);
    font-weight: 600;
  }

  .takeaway-box {
    background: rgba(218,119,86,0.1);
    border-left: 3px solid var(--accent-bright);
    border-radius: 8px;
    padding: 14px 18px;
    margin-top: 14px;
    font-size: 0.93rem;
  }

  .takeaway-box strong { color: var(--accent-bright); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dashboard-hero {
    text-align: center;
    padding: 40px 20px;
  }

  .big-score {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 4rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent-bright), var(--good));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .dash-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 20px;
  }

  .habit-list {
    list-style: none;
    margin-top: 10px;
  }

  .habit-list li {
    padding: 10px 0 10px 30px;
    position: relative;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }

  .habit-list li::before {
    content: '✓';
    position: absolute;
    left: 0;
    color: var(--good);
    font-weight: 900;
  }

  .redflag-box {
    background: rgba(224,101,74,0.12);
    border: 1px solid var(--bad);
    border-radius: 10px;
    padding: 16px 18px;
    color: var(--text);
  }

  @media (max-width: 640px) {
    .metrics-bar { grid-template-columns: repeat(2, 1fr); }
    .info-grid { grid-template-columns: 1fr; }
    .dash-grid { grid-template-columns: 1fr; }
    header.top h1 { font-size: 1.8rem; }
    .headline-display { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){

  // ---------- DATA POOLS ----------
  const headlineScenarios = [
    {
      headline: "Scientists SHOCKED as Common Household Item Found to 'Destroy' Brain Cells Overnight",
      source: "DailyPulseNow.com",
      article: "A new study observed changes in lab-grown cell cultures exposed to high concentrations of a common preservative found in some processed foods. Researchers noted the effect occurred only at doses far exceeding typical human consumption, and cautioned that more research on living organisms is needed before drawing conclusions about everyday exposure.",
      mismatches: [
        "SHOCKED",
        "'Destroy' Brain Cells Overnight",
        "Common Household Item"
      ],
      accuracy: 28,
      explanation: "The headline implies an immediate, dramatic danger from something in your home, but the actual study used lab cell cultures at extremely high doses, not real-world human exposure. Words like 'SHOCKED' and 'Destroy' create false urgency, and 'Overnight' suggests instant harm the study never claimed.",
      rewrite: "Lab Study Finds Effects From High Doses of Food Preservative, Researchers Urge Caution Before Drawing Conclusions",
      takeaway: "Headlines that use ALL CAPS, dramatic verbs, and vague qualifiers like 'common item' are often stretching preliminary lab findings into consumer panic. Always check what was actually tested."
    },
    {
      headline: "Local City Council 'Secretly' Votes to Raise Taxes While Nobody Was Watching",
      source: "TheRealTruthReport.net",
      article: "The city council approved a 0.4% increase in the municipal service fee during its regularly scheduled monthly meeting, which was publicly posted on the city website two weeks in advance and streamed live, as required by open-meeting law. Three residents attended in person and two submitted written comments.",
      mismatches: [
        "'Secretly'",
        "While Nobody Was Watching"
      ],
      accuracy: 22,
      explanation: "The vote happened at a publicly announced, legally required, livestreamed meeting — the opposite of secret. Low public turnout is being reframed as concealment to make a routine governmental process sound like a conspiracy.",
      rewrite: "City Council Approves Small Service Fee Increase at Public Monthly Meeting",
      takeaway: "Be skeptical when 'secret' or 'hidden' is used to describe something that was actually public record. Low attendance isn't the same as concealment."
    },
    {
      headline: "This One Weird Trick Doctors 'Don't Want You to Know' Can Fix Your Sleep in 3 Days",
      source: "ViralHealthDigest.co",
      article: "A small survey of 40 participants found that people who avoided screens for 30 minutes before bed reported modestly improved sleep quality over a two-week period. Sleep researchers commonly recommend reduced pre-bed screen time as one of many factors that can support better rest, alongside consistent sleep schedules and reduced caffeine intake.",
      mismatches: [
        "'Don't Want You to Know'",
        "One Weird Trick",
        "Fix Your Sleep in 3 Days"
      ],
      accuracy: 18,
      explanation: "The 'doctors don't want you to know' framing falsely implies a conspiracy of suppressed knowledge, when reduced screen time before bed is common, widely published advice. The '3 days' promise and 'weird trick' language oversell a small, unremarkable survey finding as a miracle fix.",
      rewrite: "Small Study Suggests Reducing Screen Time Before Bed May Modestly Improve Sleep Quality",
      takeaway: "Phrases like 'doctors don't want you to know' are a classic manipulation pattern designed to make ordinary advice feel like forbidden insider knowledge."
    }
  ];

  const emotionScenarios = [
    {
      platform: "Instagram Reel Caption",
      author: "@wellness.truths",
      post: "They don't want you to see this. While you're stressed and overworked, a tiny group is getting richer off your exhaustion. Wake up. Share this before it gets taken down. 😳🔥",
      audience: "Overworked adults feeling burnt out or financially anxious, especially younger audiences active on social media",
      intendedEmotion: "Anger, fear of being deceived, and urgency to act immediately",
      technique: "Us-vs-them framing combined with a false scarcity trigger ('before it gets taken down') to drive rapid, unquestioning sharing",
      emotionalPhrases: [
        "They don't want you to see this",
        "Wake up",
        "Share this before it gets taken down"
      ],
      neutralRewrite: "Some people are concerned about growing income inequality and workplace burnout. Here's some context and sources if you want to look into it further.",
      takeaway: "Content urging you to act 'before it's deleted' is a manufactured urgency trick — legitimate information doesn't need artificial deadlines to be worth sharing."
    },
    {
      platform: "X (Twitter) Post",
      author: "@newsflash_now",
      post: "Heartbreaking. A family just like yours is losing everything tonight because of decisions made by people who will never feel the consequences. How much longer will we let this happen?",
      audience: "People with strong family values and a sense of community responsibility, primed for emotional identification",
      intendedEmotion: "Grief, guilt, and a sense of moral obligation to react or agree without further information",
      technique: "Emotional identification ('just like yours') paired with a rhetorical guilt question that discourages critical questioning",
      emotionalPhrases: [
        "Heartbreaking",
        "just like yours",
        "How much longer will we let this happen?"
      ],
      neutralRewrite: "A situation is unfolding that may affect some families. Details about what happened and who is involved are still emerging.",
      takeaway: "When a post is designed to make you feel guilty for not reacting, pause — strong emotional pressure is often a substitute for missing facts."
    },
    {
      platform: "Article Excerpt",
      author: "TrendWatch Daily",
      post: "Parents are terrified. Experts warn that a new trend sweeping schools could put your child at risk, and most adults have no idea it's happening right under their noses.",
      audience: "Parents of school-age children, an audience highly sensitive to messaging about child safety",
      intendedEmotion: "Fear and protective anxiety, prompting clicks to 'find out more'",
      technique: "Vague authority appeal ('experts warn') combined with fear-based curiosity gap to drive clicks without providing specifics upfront",
      emotionalPhrases: [
        "Parents are terrified",
        "put your child at risk",
        "right under their noses"
      ],
      neutralRewrite: "A new trend has been observed in some schools. Here is what is known about it so far, according to named researchers.",
      takeaway: "Be cautious of 'experts warn' without naming the experts, and headlines built around parental fear are especially effective because they bypass logical scrutiny."
    }
  ];

  // ---------- STATE ----------
  const state = {
    step: 1, // 1 = intro, 2 = challenge1, 3 = challenge2, 4 = dashboard
    metrics: { headlineAccuracy: null, sourceReliability: 72, emotionalManipulation: null, audienceTargeting: null },
    c1: { scenario: null, clickChoice: null, misleadingText: '', revealed: false },
    c2: { scenario: null, feeling: '', words: '', revealed: false }
  };

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function newRound() {
    state.c1 = { scenario: pick(headlineScenarios), clickChoice: null, misleadingText: '', revealed: false };
    state.c2 = { scenario: pick(emotionScenarios), feeling: '', words: '', revealed: false };
    state.metrics = { headlineAccuracy: null, sourceReliability: Math.floor(60 + Math.random()*25), emotionalManipulation: null, audienceTargeting: null };
    state.step = 1;
  }

  newRound();

  const app = document.getElementById('app');

  function render() {
    let html = '';
    html += renderHeader();
    html += renderMetrics();

    if (state.step === 1) html += renderIntro();
    else if (state.step === 2) html += renderChallenge1();
    else if (state.step === 3) html += renderChallenge2();
    else if (state.step === 4) html += renderDashboard();

    app.innerHTML = html;
    attachHandlers();
  }

  function renderHeader() {
    const pct = state.step === 1 ? 0 : state.step === 2 ? 33 : state.step === 3 ? 66 : 100;
    const labels = ['Getting Started', 'Challenge 1 of 2: Headline Detective', 'Challenge 2 of 2: Emotion Detector', 'Your Media Integrity Dashboard'];
    return `
      <header class="top">
        <h1>Media Integrity Analyzer</h1>
        <p>Learn to spot manipulation in headlines and posts — by discovering it yourself.</p>
      </header>
      <div class="progress-track">
        <div class="progress-step"><div class="fill" style="width:${state.step>=1?100:0}%"></div></div>
        <div class="progress-step"><div class="fill" style="width:${state.step>=2?100:0}%"></div></div>
        <div class="progress-step"><div class="fill" style="width:${state.step>=3?100:0}%"></div></div>
        <div class="progress-step"><div class="fill" style="width:${state.step>=4?100:0}%"></div></div>
      </div>
      <div class="progress-label">${labels[state.step-1]}</div>
    `;
  }

  function metricDisplay(val) {
    return (val === null || val === undefined) ? '—' : val + '%';
  }

  function renderMetrics() {
    const m = state.metrics;
    return `
      <div class="metrics-bar">
        <div class="metric-card">
          <div class="m-label">Headline Accuracy</div>
          <div class="m-value">${metricDisplay(m.headlineAccuracy)}</div>
          <div class="metric-bar-track"><div class="metric-bar-fill" style="width:${m.headlineAccuracy||0}%"></div></div>
        </div>
        <div class="metric-card">
          <div class="m-label">Source Reliability</div>
          <div class="m-value">${metricDisplay(m.sourceReliability)}</div>
          <div class="metric-bar-track"><div class="metric-bar-fill" style="width:${m.sourceReliability||0}%"></div></div>
        </div>
        <div class="metric-card">
          <div class="m-label">Emotional Manipulation</div>
          <div class="m-value">${metricDisplay(m.emotionalManipulation)}</div>
          <div class="metric-bar-track"><div class="metric-bar-fill" style="width:${m.emotionalManipulation||0}%"></div></div>
        </div>
        <div class="metric-card">
          <div class="m-label">Audience Targeting</div>
          <div class="m-value">${metricDisplay(m.audienceTargeting)}</div>
          <div class="metric-bar-track"><div class="metric-bar-fill" style="width:${m.audienceTargeting||0}%"></div></div>
        </div>
      </div>
    `;
  }

  function renderIntro() {
    return `
      <div class="card">
        <h2>👋 Welcome, Media Detective</h2>
        <p style="color:var(--text-dim); margin-bottom:14px;">Every day, we scroll past hundreds of headlines and posts engineered to grab our attention — sometimes at the cost of truth. This isn't a quiz to see what you already know. It's a guided walk through <strong style="color:var(--text)">how</strong> to notice manipulation as it happens, so you can spot it in the wild.</p>
        <div class="concept-box">
          <strong>What you'll practice:</strong> First, we'll look at a real-feeling headline and article, and you'll decide for yourself what feels exaggerated before we reveal the analysis. Then, we'll look at a social post designed to trigger an emotional reaction, and you'll identify what's pulling your strings.
        </div>
        <p style="color:var(--text-dim); font-size:0.9rem; margin-top:10px;">No right or wrong answers up front — just observe, think, and then compare your instincts to the breakdown.</p>
        <button class="btn-primary" id="startBtn">Begin Challenge 1 →</button>
      </div>
    `;
  }

  function renderChallenge1() {
    const c = state.c1;
    const s = c.scenario;
    let out = `
      <div class="card">
        <h2><span class="badge">Concept</span> Headline Accuracy</h2>
        <div class="concept-box">
          Headlines are written to make you click — that's their job. But there's a difference between a headline that <strong>summarizes</strong> a story and one that <strong>exaggerates or distorts</strong> it to provoke a reaction. This matters because most people only read the headline, so a misleading one shapes what millions believe is true, even if the article itself is more careful.
        </div>
      </div>

      <div class="card">
        <h2>📰 Challenge 1: Headline Detective</h2>
        <div class="source-tag">Source: ${s.source}</div>
        <div class="headline-display">${s.headline}</div>
        <div class="article-body">${s.article}</div>
    `;

    if (!c.revealed) {
      out += `
        <p style="margin-top:16px; font-weight:600; font-family:'Helvetica Neue',Arial,sans-serif;">Would you click this headline?</p>
        <div class="choice-row" id="clickChoiceRow">
          ${['Yes','Maybe','No'].map(opt => `<button class="choice-btn${c.clickChoice===opt?' selected':''}" data-choice="${opt}">${opt}</button>`).join('')}
        </div>
        <p style="margin-top:10px; font-weight:600; font-family:'Helvetica Neue',Arial,sans-serif;">What parts feel exaggerated or misleading? (type a few words or phrases)</p>
        <textarea id="misleadingInput" placeholder="e.g. the dramatic wording, the vague claim...">${c.misleadingText}</textarea>
        <button class="btn-primary" id="revealC1Btn" ${!c.clickChoice ? 'disabled' : ''}>Reveal Analysis →</button>
      `;
    } else {
      const userGuessed = c.misleadingText.trim().length > 0;
      out += `
        <div class="reveal">
          <div class="score-ring-row">
            <div class="score-circle" style="background: conic-gradient(var(--accent-bright) ${s.accuracy*3.6}deg, var(--border) 0deg);">
              <span>${s.accuracy}%</span>
            </div>
            <div class="score-text-block">
              <h3>Headline Accuracy Score</h3>
              <p>This headline reflects only ${s.accuracy}% of what the article actually supports.</p>
            </div>
          </div>
          <p style="font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; margin-bottom:8px;">Highlighted Mismatches:</p>
          <div class="headline-display" style="font-size:1.2rem;">${highlightText(s.headline, s.mismatches, 'highlight-mismatch')}</div>
          <div class="concept-box"><strong>Why it's misleading:</strong> ${s.explanation}</div>
          <p style="font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; margin:14px 0 6px;">A Fair, Rewritten Headline:</p>
          <div class="rewrite-box">${s.rewrite}</div>
          <div class="takeaway-box"><strong>Key takeaway:</strong> ${s.takeaway}</div>
          ${userGuessed ? `<p style="margin-top:14px; color:var(--good); font-size:0.9rem;">✓ Nice work spotting details before the reveal — comparing your instincts to the breakdown is exactly how this skill builds over time.</p>` : ''}
          <button class="btn-primary" id="toChallenge2Btn">Continue to Challenge 2 →</button>
        </div>
      `;
    }

    out += `</div>`;
    return out;
  }

  function highlightText(text, phrases, cls) {
    let result = text;
    phrases.forEach(p => {
      const idx = result.indexOf(p);
      if (idx !== -1) {
        result = result.slice(0, idx) + `<span class="${cls}">${p}</span>` + result.slice(idx + p.length);
      }
    });
    return result;
  }

  function renderChallenge2() {
    const c = state.c2;
    const s = c.scenario;
    let out = `
      <div class="card">
        <h2><span class="badge">Concept</span> Emotional Manipulation</h2>
        <div class="concept-box">
          Content that makes you feel something strongly — anger, fear, outrage, urgency — spreads faster than calm, factual content. That's not an accident. Many posts are deliberately written to trigger an emotional reaction before your critical thinking kicks in. Recognizing <strong>which words</strong> are doing that work is the first step to reacting more thoughtfully.
        </div>
      </div>

      <div class="card">
        <h2>💬 Challenge 2: Emotion Detector</h2>
        <div class="post-meta">${s.platform} · ${s.author}</div>
        <div class="post-card">${s.post}</div>
    `;

    if (!c.revealed) {
      out += `
        <p style="margin-top:16px; font-weight:600; font-family:'Helvetica Neue',Arial,sans-serif;">How did this post make you feel?</p>
        <textarea id="feelingInput" placeholder="e.g. angry, anxious, curious...">${c.feeling}</textarea>
        <p style="margin-top:12px; font-weight:600; font-family:'Helvetica Neue',Arial,sans-serif;">Which words or phrases influenced that feeling?</p>
        <textarea id="wordsInput" placeholder="e.g. specific phrases that stood out...">${c.words}</textarea>
        <button class="btn-primary" id="revealC2Btn" ${(!c.feeling || !c.feeling.trim()) ? 'disabled' : ''}>Reveal Analysis →</button>
      `;
    } else {
      out += `
        <div class="reveal">
          <div class="info-grid">
            <div class="info-box"><div class="lbl">Target Audience</div><div class="val">${s.audience}</div></div>
            <div class="info-box"><div class="lbl">Intended Emotional Response</div><div class="val">${s.intendedEmotion}</div></div>
          </div>
          <div class="info-box" style="margin-bottom:14px;"><div class="lbl">Manipulation Technique</div><div class="val">${s.technique}</div></div>
          <p style="font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; margin-bottom:8px;">Highlighted Emotional Phrases:</p>
          <div class="post-card">${highlightText(s.post, s.emotionalPhrases, 'highlight-emotion')}</div>
          <p style="font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; margin:14px 0 6px;">A Neutral Rewrite:</p>
          <div class="rewrite-box">${s.neutralRewrite}</div>
          <div class="takeaway-box"><strong>Key takeaway:</strong> ${s.takeaway}</div>
          <button class="btn-primary" id="toDashboardBtn">See My Media Integrity Dashboard →</button>
        </div>
      `;
    }

    out += `</div>`;
    return out;
  }

  function renderDashboard() {
    const m = state.metrics;
    const overall = Math.round((m.headlineAccuracy + m.sourceReliability + (100 - m.emotionalManipulation) + (100 - m.audienceTargeting)) / 4);
    const redFlagPool = [
      "Headlines using ALL CAPS or dramatic words like 'SHOCKED' to provoke a click.",
      "Posts urging you to 'share before it's deleted' — manufactured urgency is a manipulation trick.",
      "Vague appeals to unnamed 'experts' or 'doctors' without any specifics.",
      "Framing routine, public events as 'secret' or 'hidden' from you."
    ];
    const redFlag = pick(redFlagPool);
    return `
      <div class="card dashboard-hero">
        <h2 style="justify-content:center;">🎓 Media Integrity Dashboard</h2>
        <div class="big-score">${overall}</div>
        <p style="color:var(--text-dim); margin-top:6px;">Overall Media Integrity Awareness Score</p>
      </div>

      <div class="card">
        <h2>What You Learned</h2>
        <p style="color:var(--text-dim);">You practiced separating a headline's <strong style="color:var(--text)">emotional packaging</strong> from the actual substance of a story, and you learned to identify specific words and techniques designed to trigger fear, anger, or urgency in social posts. Both skills transfer directly to your everyday feed.</p>
      </div>

      <div class="dash-grid">
        <div class="card" style="margin-bottom:0;">
          <h2>🚩 Biggest Red Flag to Watch For</h2>
          <div class="redflag-box">${redFlag}</div>
        </div>
        <div class="card" style="margin-bottom:0;">
          <h2>✅ Practical Habits</h2>
          <ul class="habit-list">
            <li>Read past the headline before reacting or sharing.</li>
            <li>Pause when you feel a strong emotional pull — that's often the point.</li>
            <li>Check who is being targeted and why, before trusting the framing.</li>
          </ul>
        </div>
      </div>

      <div class="card" style="text-align:center;">
        <h2 style="justify-content:center;">Ready for More?</h2>
        <p style="color:var(--text-dim); margin-bottom:10px;">New headlines, new posts, same sharp eye.</p>
        <button class="btn-primary" id="replayBtn">Replay with New Scenarios ↺</button>
      </div>
    `;
  }

  function attachHandlers() {
    const startBtn = document.getElementById('startBtn');
    if (startBtn) startBtn.onclick = () => { state.step = 2; render(); };

    const clickRow = document.getElementById('clickChoiceRow');
    if (clickRow) {
      clickRow.querySelectorAll('.choice-btn').forEach(btn => {
        btn.onclick = () => {
          state.c1.clickChoice = btn.getAttribute('data-choice');
          render();
        };
      });
    }

    const misleadingInput = document.getElementById('misleadingInput');
    if (misleadingInput) {
      misleadingInput.oninput = (e) => { state.c1.misleadingText = e.target.value; };
    }

    const revealC1Btn = document.getElementById('revealC1Btn');
    if (revealC1Btn) {
      revealC1Btn.onclick = () => {
        state.c1.revealed = true;
        state.metrics.headlineAccuracy = state.c1.scenario.accuracy;
        render();
      };
    }

    const toChallenge2Btn = document.getElementById('toChallenge2Btn');
    if (toChallenge2Btn) toChallenge2Btn.onclick = () => { state.step = 3; render(); };

    const feelingInput = document.getElementById('feelingInput');
    if (feelingInput) {
      feelingInput.oninput = (e) => {
        state.c2.feeling = e.target.value;
        const btn = document.getElementById('revealC2Btn');
        if (btn) btn.disabled = !e.target.value.trim();
      };
    }

    const wordsInput = document.getElementById('wordsInput');
    if (wordsInput) {
      wordsInput.oninput = (e) => { state.c2.words = e.target.value; };
    }

    const revealC2Btn = document.getElementById('revealC2Btn');
    if (revealC2Btn) {
      revealC2Btn.onclick = () => {
        state.c2.revealed = true;
        state.metrics.emotionalManipulation = Math.floor(70 + Math.random()*25);
        state.metrics.audienceTargeting = Math.floor(65 + Math.random()*30);
        render();
      };
    }

    const toDashboardBtn = document.getElementById('toDashboardBtn');
    if (toDashboardBtn) toDashboardBtn.onclick = () => { state.step = 4; render(); };

    const replayBtn = document.getElementById('replayBtn');
    if (replayBtn) replayBtn.onclick = () => { newRound(); render(); };
  }

  render();
})();
</script>
</body>
</html>
